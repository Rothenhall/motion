name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: motion
          POSTGRES_PASSWORD: motion
          POSTGRES_DB: motion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U motion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # The pre-flight tests build their sample reels and images with ffmpeg.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      # The production image runs the compiled output (and the demo seed script), so make sure it compiles.
      - run: npm run build
      # Fails when prisma/schema.prisma and the committed migrations disagree, for example a schema edit with no migration.
      # It replays every migration into a scratch database (motion_shadow) and compares the result with the schema.
      # The hand-written partial index SocialAccount_connected_channel_key does not show up as a difference, because Prisma
      # does not read partial indexes; it is still created by the migration, and the tests cover the rule it enforces.
      - name: Check migrations match the schema
        env:
          PGPASSWORD: motion
          DATABASE_URL: postgresql://motion:motion@localhost:5432/motion_test?schema=public
        run: |
          psql -h localhost -U motion -d postgres -c 'create database motion_shadow'
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url 'postgresql://motion:motion@localhost:5432/motion_shadow?schema=public' \
            --exit-code
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
