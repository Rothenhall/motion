# Local stack: Postgres + backend + frontend.
#   docker compose up -d db          # just the database (run the apps with npm)
#   docker compose up --build        # everything
#   docker compose --profile gpu up  # also the TRIBE v2 audience simulation (NVIDIA GPU, ~32 GB VRAM)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: motion
      POSTGRES_PASSWORD: motion
      POSTGRES_DB: motion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motion -d motion"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://motion:motion@db:5432/motion?schema=public
    ports:
      - "3001:3001"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Optional TRIBE v2 service for pre-flight checks. Set TRIBE_SERVICE_URL=http://tribe:8000 and
  # TRIBE_SERVICE_TOKEN in backend/.env to use it; HF_TOKEN must be approved for Llama 3.2-3B.
  tribe:
    profiles: ["gpu"]
    build: ./tribe-service
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      TRIBE_SERVICE_TOKEN: ${TRIBE_SERVICE_TOKEN:-}
    volumes:
      - tribe-cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  pgdata:
  uploads:
  tribe-cache:
