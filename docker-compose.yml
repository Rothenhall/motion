# Local stack: Postgres + backend + frontend.
#   docker compose up -d db          # just the database (run the apps with npm)
#   docker compose up --build        # everything
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: motion
      POSTGRES_PASSWORD: motion
      POSTGRES_DB: motion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motion -d motion"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://motion:motion@db:5432/motion?schema=public
    ports:
      - "3001:3001"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
